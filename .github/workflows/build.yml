name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.405

      - name: Restore
        run: dotnet restore --configfile NuGet.Config

      - name: Build
        run: dotnet build -c Release --no-restore
